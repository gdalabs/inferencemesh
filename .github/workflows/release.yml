# Build a single executable per platform and attach it to the release.
#
# Node's SEA support is the whole mechanism: bundle to one CommonJS file, build
# a blob, copy the node binary, inject. There is no cross-compilation — each
# target needs a runner of that OS and architecture, which is why this matrix
# exists rather than one build step.
name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: '20' }
      - run: npm ci
      # The suite needs no network, so a failure here is a real failure.
      - run: npm test

  binary:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,  target: linux-x64,   ext: '' }
          - { os: ubuntu-24.04-arm, target: linux-arm64, ext: '' }
          # macos-13 was retired on 2025-12-04. It did not fail — it queued
          # forever while every other leg finished in under a minute, which on
          # a tag would have hung the release instead of reporting anything.
          # macos-15-intel is the last x86_64 image Actions offers, and it goes
          # away in August 2027; after that this row has no runner at all.
          - { os: macos-15-intel, target: darwin-x64,  ext: '' }
          - { os: macos-14,       target: darwin-arm64, ext: '' }
          - { os: windows-latest, target: win32-x64,   ext: '.exe' }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: '20' }
      - run: npm ci
      - run: npm run build && npm run bundle
      - run: node --experimental-sea-config sea-config.json

      - name: Assemble (unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          cp "$(command -v node)" "build/inferencemesh"
          # macOS refuses to run a binary whose signature no longer matches the
          # bytes, so the inherited signature is stripped and re-applied ad-hoc.
          if [ "$RUNNER_OS" = "macOS" ]; then codesign --remove-signature "build/inferencemesh"; fi
          npx postject "build/inferencemesh" NODE_SEA_BLOB build/sea-prep.blob \
            --sentinel-fuse NODE_SEA_FUSE_fce680ab2cc467b6e072b8b5df1996b2 \
            ${RUNNER_OS:+$([ "$RUNNER_OS" = "macOS" ] && echo "--macho-segment-name NODE_SEA")}
          if [ "$RUNNER_OS" = "macOS" ]; then codesign --sign - "build/inferencemesh"; fi
          mv "build/inferencemesh" "build/inferencemesh-${{ matrix.target }}"

      - name: Assemble (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          node -e "require('fs').copyFileSync(process.execPath,'build/inferencemesh.exe')"
          npx postject build/inferencemesh.exe NODE_SEA_BLOB build/sea-prep.blob --sentinel-fuse NODE_SEA_FUSE_fce680ab2cc467b6e072b8b5df1996b2
          Move-Item build/inferencemesh.exe build/inferencemesh-${{ matrix.target }}.exe

      # A binary that was never executed is not known to work. This is the
      # cheapest possible proof: it must route, with no network at all.
      # The key is fake and goes nowhere — `route` is pure. It is here so the
      # step does not quietly depend on the registry still containing a
      # keyless provider, which is not a property of this binary.
      - name: Smoke test the binary
        shell: bash
        env:
          OPENROUTER_API_KEY: ci-not-a-real-key
        run: |
          ./build/inferencemesh-${{ matrix.target }}${{ matrix.ext }} route free | head -5

      - uses: actions/upload-artifact@v4
        with:
          name: inferencemesh-${{ matrix.target }}
          path: build/inferencemesh-${{ matrix.target }}${{ matrix.ext }}

  publish:
    needs: binary
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { path: dist-bin, merge-multiple: true }
      - run: |
          cd dist-bin && sha256sum * > SHA256SUMS && cat SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          files: dist-bin/*
          generate_release_notes: true
